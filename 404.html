<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Bestie HQ</title>
<link rel="icon" href="/levelup-hq/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f2fb;--surface:#fff;--ink:#221a33;--muted:#6c6382;--line:#e2dbef;--accent:#f28f2c}
  @media (prefers-color-scheme: dark){:root{--bg:#140f20;--surface:#1e172e;--ink:#f2edfb;--muted:#a59bbd;--line:#342a4b;--accent:#ffa552}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;text-align:center}
  .card{background:var(--surface);border:2px solid var(--line);border-radius:24px;box-shadow:0 4px 0 var(--line);padding:28px 22px;max-width:360px}
  img{width:96px;height:96px;transform:rotate(-8deg)}
  h1{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;margin:10px 0 6px}
  p{color:var(--muted);margin:0 0 18px}
  a{display:inline-block;background:var(--accent);color:#2b1400;font-family:"Fredoka",system-ui,sans-serif;font-weight:600;text-decoration:none;padding:10px 18px;border-radius:16px;box-shadow:0 4px 0 #c46a12}
  a:focus-visible{outline:3px solid #6a4bd6;outline-offset:3px}
</style>
</head>
<body>
  <main class="card">
    <img src="/levelup-hq/favicon.svg" alt="">
    <h1>This page wandered off</h1>
    <p>The Pom sniffed around, but this page doesn't exist.</p>
    <a href="/levelup-hq/">Back to Bestie HQ</a>
  </main>
</body>
</html>
