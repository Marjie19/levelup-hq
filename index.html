<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:title" content="LevelUp HQ">
<meta property="og:description" content="A cute, game-like student life app. Track your road to graduation, side quests, budget and wishlist.">
<meta property="og:url" content="https://marjie19.github.io/levelup-hq/">
<meta property="og:image" content="https://marjie19.github.io/levelup-hq/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<!-- Mascot template. pomSvg() copies it. The "sleepy" class swaps open eyes for closed ones. -->
<svg hidden aria-hidden="true">
  <svg class="pom" viewBox="0 0 48 48" aria-hidden="true" id="pomTpl">
    <g fill="#f29a3e"><circle cx="9" cy="22" r="7"/><circle cx="39" cy="22" r="7"/><circle cx="12" cy="34" r="7"/><circle cx="36" cy="34" r="7"/><circle cx="24" cy="40" r="7"/><circle cx="16" cy="13" r="6"/><circle cx="32" cy="13" r="6"/></g>
    <path d="M11 15 L15 3 L22 12Z M26 12 L33 3 L37 15Z" fill="#d9772a"/>
    <circle cx="24" cy="26" r="15" fill="#f7a94f"/>
    <ellipse cx="24" cy="31" rx="9" ry="7.5" fill="#ffe3c2"/>
    <circle cx="14.5" cy="29" r="2.2" fill="#ff8fa3" opacity=".55"/><circle cx="33.5" cy="29" r="2.2" fill="#ff8fa3" opacity=".55"/>
    <g class="eyes-open"><circle cx="18.5" cy="24" r="2.3" fill="#2a1a10"/><circle cx="29.5" cy="24" r="2.3" fill="#2a1a10"/>
      <circle cx="19.2" cy="23.3" r=".7" fill="#fff"/><circle cx="30.2" cy="23.3" r=".7" fill="#fff"/></g>
    <g class="eyes-shut" stroke="#2a1a10" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M16.3 24.5 q2.2 1.8 4.4 0"/><path d="M27.3 24.5 q2.2 1.8 4.4 0"/></g>
    <ellipse cx="24" cy="29" rx="2.6" ry="1.9" fill="#2a1a10"/>
    <path d="M21 32.5 q3 2.6 6 0" stroke="#2a1a10" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </svg>
</svg>

<div class="app">
  <!-- Phone: bottom tab bar. Laptop: left sidebar. Same buttons, CSS moves them. -->
  <nav class="nav" aria-label="Sections">
    <div class="brand"><span id="brandPom"></span><b>LevelUp HQ</b></div>
    <div class="navlist" role="tablist">
      <button class="tab" role="tab" data-tab="journey" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <span>Journey</span></button>
      <button class="tab" role="tab" data-tab="deans" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5Z"/><path d="M6 11.5V16c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5"/><path d="M22 9v6"/></svg>
        <span>Dean's List</span></button>
      <button class="tab" role="tab" data-tab="money" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>
        <span>Money</span></button>
      <button class="tab" role="tab" data-tab="planner" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="4"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
        <span>Planner</span><i class="soon">soon</i></button>
    </div>
  </nav>

  <div class="main">
    <header class="top">
      <span class="toppom" id="topPom"></span>
      <div class="hello">
        <h1 id="hi">Hi, Player!</h1>
        <div class="lvlrow">
          <span class="lvlpill num"><b>Lv <span id="lvl">1</span></b> <span id="ltitle">Freshie</span></span>
          <div class="bar" role="progressbar" aria-label="XP to next level" aria-valuemin="0" aria-valuemax="500" id="xpbarWrap"><i id="xpbar" style="width:0%"></i></div>
        </div>
        <p class="xpline num" id="xpline">0 XP</p>
      </div>
      <button class="iconbtn" id="settingsBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/templates.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/game.js"></script>
<script src="js/views/header.js"></script>
<script src="js/views/journey.js"></script>
<script src="js/views/deans.js"></script>
<script src="js/views/money.js"></script>
<script src="js/views/planner.js"></script>
<script src="js/journeyedit.js"></script>
<script src="js/modals.js"></script>
<script src="js/events.js"></script>
<script src="js/app.js"></script>
<script>if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
