<head>

<meta name="theme-color" content="#1f1a22" media="(prefers-color-scheme: dark)">
<title>Bestie HQ</title>
<meta name="description" content="A cute, game-like student life app. Track your road to graduation, side quests, budget and wishlist, with a Pomeranian buddy.">
<meta property="og:type" content="website">
<meta property="og:title" content="Bestie HQ">
<meta property="og:description" content="A cute, game-like student life app. Track your road to graduation, side quests, budget and wishlist.">
<meta property="og:url" content="https://marjie19.github.io/levelup-hq/">
<meta property="og:image" content="https://marjie19.github.io/levelup-hq/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bestie">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<div class="app">
  <!-- Phone: bottom tab bar. Laptop: left sidebar. Same buttons, CSS moves them. -->
  <nav class="nav" aria-label="Sections">
    <div class="brand"><span id="brandPom"></span><b>Bestie HQ</b></div>
    <div class="navlist" role="tablist">
      <button class="tab" role="tab" data-tab="home" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.6-7-10.2A4 4 0 0 1 12 8a4 4 0 0 1 7 2.8C19 16.4 12 21 12 21Z"/></svg>
        <span>Home</span></button>
      <button class="tab" role="tab" data-tab="journey" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <span>Journey</span></button>
      <button class="tab" role="tab" data-tab="study" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5Z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5-.7 1.5-1.5Z"/></svg>
        <span>Study</span></button>
      <button class="tab" role="tab" data-tab="money" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></svg>
        <span>Money</span></button>
      <button class="tab" role="tab" data-tab="school" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5Z"/><path d="M6 11.5V16c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5"/><path d="M22 9v6"/></svg>
        <span>School</span></button>
    </div>
  </nav>

  <div class="main">
    <header class="top">
      <button type="button" class="toppom" id="topPom" data-tab="home" aria-label="Go to your companion"></button>
      <div class="hello">
        <h1 id="hi">Hi, Player!</h1>
        <div class="lvlrow">
          <span class="lvlpill" id="stageLine">Pom</span>
          <div class="bar" role="progressbar" aria-label="How happy your companion is" aria-valuemin="0" aria-valuemax="500" id="xpbarWrap"><i id="xpbar" style="width:0%"></i></div>
        </div>
        <p class="xpline" id="xpline"></p>
      </div>
      <span class="treatpill" id="treatPill">🍪 0</span>
      <button class="iconbtn" id="tipsBtn" type="button" aria-label="Show the tip for this screen"><b aria-hidden="true">?</b></button>
      <button class="iconbtn" id="settingsBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/templates.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/fx.js"></script>
<script src="js/storage.js"></script>
<script src="js/game.js"></script>
<script src="js/pets.js"></script>
<script src="js/views/header.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/journey.js"></script>
<script src="js/views/deans.js"></script>
<script src="js/coach.js"></script>
<script src="js/views/money.js"></script>
<script src="js/views/school.js"></script>
<script src="js/views/study.js"></script>
<script src="js/views/profile.js"></script>
<script src="js/petsheets.js"></script>
<script src="js/journeyedit.js"></script>
<script src="js/receipts.js"></script>
<script src="js/modals.js"></script>
<script src="js/tips.js"></script>
<script src="js/reminders.js"></script>
<script src="js/events.js"></script>
<script src="js/app.js"></script>
<script>if("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
